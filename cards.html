<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cardiff</title>
    <link rel="stylesheet" href="/cardiff/themes/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
    <script src="/cardiff/scripts/loader.js" defer></script>
</head>
<body>
    <main>
        <section class="cards"></section>
    </main>

    <div class="bottom-bar">
        <nav class="bottom-bar-group" aria-label="Навигация по сайту">
            <a href="/cardiff/" class="bottom-bar-item" aria-label="На главную">
                <span class="material-symbols-outlined bottom-bar-icon" aria-hidden="true">home</span>
            </a>
        </nav>

        <span class="bottom-bar-sep" aria-hidden="true"></span>

        <nav class="bottom-bar-group" aria-label="Порядок карточек">
            <button type="button" class="bottom-bar-item" data-mode="ebbinghaus" aria-pressed="false" aria-label="По Эббингаузу">
                <span class="material-symbols-outlined bottom-bar-icon" aria-hidden="true">schedule</span>
            </button>
            <span class="bottom-bar-sep-thin" aria-hidden="true"></span>
            <button type="button" class="bottom-bar-item bottom-bar-item-grey" data-mode="grey" aria-pressed="false" aria-label="Только серые"></button>
            <span class="bottom-bar-sep-thin" aria-hidden="true"></span>
            <button type="button" class="bottom-bar-item bottom-bar-item-red" data-mode="red" aria-pressed="false" aria-label="Только красные"></button>
            <span class="bottom-bar-sep-thin" aria-hidden="true"></span>
            <button type="button" class="bottom-bar-item" data-mode="random" aria-pressed="false">RND</button>
            <span class="bottom-bar-sep-thin" aria-hidden="true"></span>
            <button type="button" class="bottom-bar-item" data-mode="all" aria-pressed="true">ALL</button>
        </nav>

        <span class="bottom-bar-sep" aria-hidden="true"></span>

        <nav class="bottom-bar-group" aria-label="Навигация по карточкам">
            <button type="button" class="bottom-bar-item" data-nav="prev" aria-label="Предыдущая карточка">&lt;</button>
            <span class="bottom-bar-sep-thin" aria-hidden="true"></span>
            <span class="bottom-bar-counter">
                <span class="bottom-bar-current">1</span>/<span class="bottom-bar-total">1</span>
            </span>
            <span class="bottom-bar-sep-thin" aria-hidden="true"></span>
            <button type="button" class="bottom-bar-item" data-nav="next" aria-label="Следующая карточка">&gt;</button>
        </nav>
    </div>

    <template id="card-template">
        <div class="slide">
            <article class="card" data-side="question">
                <div class="card-path"></div>
                <div class="card-body">
                    <section class="card-question" aria-label="Вопрос">
                        <ul class="card-list"></ul>
                    </section>
                    <section class="card-answer" aria-label="Ответ" hidden>
                        <ul class="card-list"></ul>
                    </section>
                </div>
                <footer class="card-footer">
                    <div class="grades" role="group" aria-label="Оценка сложности">
                        <button type="button" class="grade grade-easy"   data-grade="easy"></button>
                        <button type="button" class="grade grade-medium" data-grade="medium"></button>
                        <button type="button" class="grade grade-hard"   data-grade="hard"></button>
                    </div>
                    <button type="button" class="flip" aria-label="Показать ответ" aria-pressed="false">
                        <span class="flip-icon" aria-hidden="true">⇄</span>
                    </button>
                </footer>
            </article>
        </div>
    </template>
</body>
</html>
